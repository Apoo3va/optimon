name: CI

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build tests (warnings as errors, address + undefined-behaviour sanitizers)
        run: >
          g++ -std=c++17 -Wall -Wextra -Werror -O1 -g
          -fsanitize=address,undefined -fno-omit-frame-pointer
          -I wokwi tests/test_main.cpp -o run_tests

      - name: Run tests
        run: ./run_tests
